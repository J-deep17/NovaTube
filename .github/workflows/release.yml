name: Publish NovaTube Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Signing Key
        run: |
          # Generate a signing key if one does not exist so APKs can be installed on Android TV / Fire TV
          keytool -genkeypair -v -keystore "${GITHUB_WORKSPACE}/release.keystore" \
            -alias novatube -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass novatubepass -keypass novatubepass \
            -dname "CN=NovaTube, OU=Dev, O=NovaTube, L=City, S=State, C=US"
          
          echo "storePassword=novatubepass" > keystore.properties
          echo "keyAlias=novatube" >> keystore.properties
          echo "keyPassword=novatubepass" >> keystore.properties
          echo "storeFile=${GITHUB_WORKSPACE}/release.keystore" >> keystore.properties

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Build Release APKs (Stable & Beta)
        run: |
          ./gradlew clean assembleStstableRelease assembleStbetaRelease -x lint

      - name: Determine Tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.TAG_NAME }}
        run: |
          gh release create "$TAG" \
            smarttubetv/build/outputs/apk/ststable/release/*.apk \
            smarttubetv/build/outputs/apk/stbeta/release/*.apk \
            --title "NovaTube TV $TAG" \
            --notes "### 📺 NovaTube TV $TAG Release

          Ready-to-install release for **Redmi Fire TV, Amazon Fire TV Stick, Google TV, and Android TV**.

          #### 📦 Available APKs:
          - **Universal APK (`*_universal.apk`)**: Recommended for all devices (Redmi Fire TV, Firestick 4K/Max, Google TV, NVIDIA Shield).
          - **ARM64 APK (`*_arm64-v8a.apk`)**: For 64-bit devices.
          - **ARMv7 APK (`*_armeabi-v7a.apk`)**: For older 32-bit TV boxes and sticks.

          #### 🚀 How to Install on Fire TV / Google TV:
          1. Open the **Downloader** app on your Fire TV or Android TV.
          2. Enter the direct download URL for the APK from below.
          3. Click Install and enjoy ad-free YouTube with the modern YouTube TV UI."
