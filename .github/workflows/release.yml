name: Publish NovaTube Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # OTA installation requires every release to use the SAME signing certificate.
      # Never generate a new key for each release: Android will reject the update.
      - name: Configure persistent release signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ] || [ -z "$KEY_STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing. Configure SIGNING_KEY, KEY_STORE_PASSWORD, ALIAS and KEY_PASSWORD. Do not generate a new key: it would break OTA upgrades."
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" | base64 --decode > "${GITHUB_WORKSPACE}/release.keystore"
          cat > keystore.properties <<EOF
          storePassword=$KEY_STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storeFile=${GITHUB_WORKSPACE}/release.keystore
          EOF
          chmod 600 "${GITHUB_WORKSPACE}/release.keystore" keystore.properties

      - name: Inspect and verify permanent keystore fingerprint
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
        run: |
          set -euo pipefail
          echo "=== Keystore Certificate Info ==="
          keytool -list -v -keystore "${GITHUB_WORKSPACE}/release.keystore" -storepass "$KEY_STORE_PASSWORD" -alias "$KEY_ALIAS" | grep -E "Owner:|Issuer:|Certificate fingerprints|SHA256:|Valid from:"

      - name: Grant Gradle permissions
        run: chmod +x ./gradlew

      - name: Build Release APKs (Stable & Beta)
        run: ./gradlew clean assembleStstableRelease assembleStbetaRelease -x lint

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found in Android build-tools"
            exit 1
          fi
          echo "Using apksigner at: $APKSIGNER"
          APKS=$(find smarttubetv/build/outputs/apk -type f -name '*.apk')
          test -n "$APKS"
          while IFS= read -r apk; do
            echo "Verifying signature for: $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done <<< "$APKS"

      - name: Determine Tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "TAG_NAME=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.TAG_NAME }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            smarttubetv/build/outputs/apk/ststable/release/*.apk \
            smarttubetv/build/outputs/apk/stbeta/release/*.apk \
            release/novatube_stable.json \
            release/novatube_beta.json \
            --title "NovaTube TV $TAG" \
            --notes "NovaTube TV release. Universal APK is recommended for Fire TV and Android TV. All releases are signed with the persistent NovaTube release key so in-app OTA upgrades remain compatible."
